name: Publish Wasla Operations Guide

on:
  push:
    branches: [master, main]
    paths:
      - "operations-guide/**"
      - ".github/workflows/operations-guide-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate guide
        run: npm --prefix operations-guide run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload guide only
        uses: actions/upload-pages-artifact@v3
        with:
          path: operations-guide/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
